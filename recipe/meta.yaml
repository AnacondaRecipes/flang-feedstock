{% set version = "23.1.4" %}

package:
  name: flang-split
  version: {{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-{{ version.replace(".rc", "-rc") }}.tar.gz
  sha256: 3e1c70b30f623976c2046d94b8eeab6cac536f107914cb4ed7bac572a03131db

build:
  number: 0
  # Skipping osx: upstream llvm/llvm-project#154960 ("a dialect with
  # namespace 'arith' has already been registered") is still OPEN as of
  # LLVM 23.1.4 (verified 2026-10-23). Re-enable once upstream fixes it.
  skip: true  # [osx]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja-base
    - mlir =={{ version }}     # [build_platform != target_platform]
  host:
    - clangdev =={{ version }}
    - compiler-rt =={{ version }}
    - lit =={{ version }}
    - llvmdev =={{ version }}
    - mlir =={{ version }}
    - zlib {{ zlib }}

outputs:
  - name: flang
    script: install_flang.sh  # [unix]
    script: install_flang.bat  # [win]
    requirements:
      build:
        - cmake
        - ninja-base
        # for strong run-exports
        - {{ compiler('c') }}
        - {{ stdlib('c') }}
        - {{ compiler('cxx') }}
      host:
        - clangdev =={{ version }}
        - compiler-rt =={{ version }}
        - llvmdev =={{ version }}
        - mlir =={{ version }}
        # for required run-exports
        - llvm =={{ version }}
        - libclang-cpp =={{ version }}
        # ninja really wants to find z.lib on win
        - zlib {{ zlib }}  # [win]
        - zstd {{ zstd }}  # [win]
      run:
        - sysroot_{{ target_platform }} >={{ c_stdlib_version }}    # [linux]
        - clang =={{ version }}
        - compiler-rt =={{ version }}   # [win]
        - libmlir23 =={{ version }}      # [linux]
    test:
      commands:
        - test -f $PREFIX/bin/flang                     # [linux]
        - if not exist %LIBRARY_BIN%\flang.exe exit 1   # [win]
        # loads the shared LLVM/MLIR/clang libraries; needs neither flang-rt nor the intrinsic modules
        - flang --version
        # compile to an object only: no runtime link and no intrinsic-module import (both come from flang-rt)
        - printf 'subroutine s\n  real x\n  x = 2.0\nend subroutine s\n' > smoke.f90   # [unix]
        - (echo subroutine s& echo real x& echo x = 2.0& echo end subroutine s) > smoke.f90   # [win]
        - flang -c smoke.f90 -o smoke.o
        - test -f smoke.o                     # [unix]
        - if not exist smoke.o exit 1         # [win]

about:
  home: https://flang.llvm.org
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: flang/LICENSE.TXT
  doc_url: https://flang.llvm.org/docs/
  summary: Flang is a Fortran compiler targeting LLVM.
  description: |
    Flang is a Fortran compiler targeting LLVM. It is designed to integrate
    with the LLVM ecosystem and provides a modern Fortran compiler implementation.
  dev_url: https://github.com/llvm/llvm-project

extra:
  skip-lints:
    # flang's host lists `llvm` for its run_exports, which the linter mistakes for a compiler requirement
    - should_use_compilers
  recipe-maintainers:
    - isuruf
    - h-vetinari
  feedstock-name: flang
